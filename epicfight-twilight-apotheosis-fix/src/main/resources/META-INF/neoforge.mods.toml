[[mods]]
modId="eftwilightapotheosisfix"
version="0.1.4"
displayName="Epic Fight Twilight Apotheosis Fix"
authors="eynoik"
description='''Targeted compatibility patch for Minecraft 1.21.1 NeoForge. Bridges Apotheosis and TwilightForestEFCompat projectile recursion markers, disables P1nero automatic target fallback, prevents competing bow yaw writes, caches Twilight displayed weapon attributes, and memoizes Epic Fight tooltip mutation once per client tick to avoid repeated render-thread damage recalculation in JEI/inventory tooltips.'''

