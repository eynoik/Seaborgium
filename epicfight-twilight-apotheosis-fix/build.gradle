plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'dev.eynoik'
version = '0.2.0'

base {
    archivesName = 'EpicFightTwilightApotheosisFix'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    stubs {
        java.srcDir 'src/stubs/java'
    }
    main {
        compileClasspath += sourceSets.stubs.output
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('compileStubsJava')
}

neoForge {
    version = '21.1.248'
    mods {
        eftwilightapotheosisfix {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'MixinConfigs': 'eftwilightapotheosisfix.mixins.json',
                'Implementation-Title': 'Epic Fight Compatibility Fixes',
                'Implementation-Version': project.version,
                'Created-By': 'OpenAI'
        )
    }
}
