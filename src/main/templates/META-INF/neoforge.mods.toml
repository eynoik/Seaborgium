modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

issueTrackerURL="https://github.com/eynoik/Seaborgium/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/eynoik/Seaborgium/tree/create-logistics-overrequest-fix"
authors="eynoik"
description='''Dedicated-server fix for Create 6.0.11 Factory Gauge / Packager over-requesting.'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1,22)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="${create_version_range}"
ordering="AFTER"
side="SERVER"
