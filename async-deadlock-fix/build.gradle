plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = 'dev.eynoik'
version = '0.1.0'

base {
    archivesName = 'AsyncDeadlockFix'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'
    mods {
        asyncdeadlockfix {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
                'MixinConfigs': 'asyncdeadlockfix.mixins.json',
                'Implementation-Title': 'Async Deadlock Fix',
                'Implementation-Version': project.version,
                'Created-By': 'OpenAI'
        )
    }
}
