[[mods]]
modId="asyncsablefix"
version="0.2.2"
displayName="AsyncGuard"
authors="eynoik"
description='''
Compatibility and thread-safety guard pack for Async 0.2.0 alpha on Minecraft 1.21.1.
Preserves the existing Sable collision/raycast, chunk-access, AttributeMap/Lithium, entity-family,
PneumaticCraft, Hundred Years Warfare and Curios/Relics protections. 0.2.2 additionally guards
Minecraft Comes Alive 7.7.36-beta.3 village-tax delivery: storage blocks in chunks that are not
already loaded are skipped instead of allowing VillageTaxesManager#getBlockState to synchronously
enter ServerChunkCache/C2ME chunk loading and watchdog the server. Tax items stay buffered for a
later delivery attempt. The legacy technical mod id "asyncsablefix" is intentionally retained so
old and new JARs cannot silently coexist and apply the same compatibility mixins twice.
'''

[[mixins]]
config="asyncguard.mixins.json"

[[dependencies.asyncsablefix]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.asyncsablefix]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.asyncsablefix]]
modId="async"
type="required"
versionRange="[0.2.0,0.3.0)"
ordering="AFTER"
side="SERVER"

[[dependencies.asyncsablefix]]
modId="sable"
type="required"
versionRange="[2.0.5,2.1.0)"
ordering="AFTER"
side="SERVER"
