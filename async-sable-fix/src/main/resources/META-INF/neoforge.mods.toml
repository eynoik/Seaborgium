[[mods]]
modId="asyncsablefix"
version="0.1.7"
displayName="Async Sable Fix"
authors="eynoik"
description='''
Compatibility patch for Async 0.2.0 alpha and Sable 2.0.5 on Minecraft 1.21.1.
Keeps Async entity ticking enabled while isolating Sable's non-thread-safe sub-level collision critical section.
Sable SubLevelEntityCollision calls are serialized instead of truncating collision scans, so normal Sable collision
and tracking remain intact while concurrent Async entity movement cannot corrupt shared Sable collision scratch state.
Loaded-only Sable LevelAccelerator guards now apply only on Async workers; normal server-thread assembly/disassembly
uses Sable's original behavior. Existing chunk deadlock, raycast/LOS, AttributeMap, Create, MCA and MineColonies
compatibility protections remain enabled.
'''

[[mixins]]
config="asyncsablefix.mixins.json"

