[[mods]]
modId="asyncsablefix"
version="0.1.6.1"
displayName="Async Sable Fix"
authors="eynoik"
description='''
Compatibility patch for Async 0.2.0 alpha and Sable 2.0.5 on Minecraft 1.21.1.
Prevents Sable collision reads from generating unloaded chunks, caps pathological Sable collision scans,
keeps known non-thread-safe contraption/citizen entities synchronous, and makes Async-worker collision
chunk lookups non-blocking without modifying ServerChunkCache (avoiding a Sable mixin conflict).
0.1.6.1 is the startup-safe rebuild of 0.1.6; collision/cache logic is unchanged from 0.1.6.
'''

[[mixins]]
config="asyncsablefix.mixins.json"

[[dependencies.asyncsablefix]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.asyncsablefix]]
