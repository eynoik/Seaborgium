name: Build AsyncSableFix 0.1.7

on:
  pull_request:
    paths:
      - 'async-sable-fix/**'
      - '.github/workflows/build-asyncsablefix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle -p async-sable-fix clean build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: asyncsablefix-0.1.7
          path: async-sable-fix/build/libs/asyncsablefix-0.1.7.jar
          if-no-files-found: error
