name: Build AsyncDeadlockFix

on:
  push:
    branches:
      - async-deadlock-fix-0.1.1
    paths:
      - 'async-deadlock-fix/**'
      - '.github/workflows/build-asyncdeadlockfix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Async deadlock fix
        run: ./gradlew -p async-deadlock-fix clean build

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: AsyncDeadlockFix-0.1.1
          path: async-deadlock-fix/build/libs/AsyncDeadlockFix-0.1.1.jar
          if-no-files-found: error
